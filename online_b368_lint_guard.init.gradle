import java.security.MessageDigest
import org.gradle.api.artifacts.verification.DependencyVerificationMode

def need = { boolean ok, String why -> if (!ok) throw new GradleException('B368_LINT_EXEC_REFUSED:' + why) }
def sha = { File f ->
    def dig = MessageDigest.getInstance('SHA-256')
    f.withInputStream { stream ->
        byte[] b = new byte[65536]
        for (int n = stream.read(b); n != -1; n = stream.read(b)) dig.update(b,0,n)
    }
    dig.digest().encodeHex().toString()
}
def s = gradle.startParameter
def targets = [':app:lintStandardRelease']
need(gradle.gradleVersion=='9.3.1' && s.offline && !s.dryRun && !s.refreshDependencies && !s.configurationCacheRequested &&
     !s.buildCacheEnabled && !s.parallelProjectExecutionEnabled && s.maxWorkerCount==1 &&
     s.dependencyVerificationMode==DependencyVerificationMode.STRICT && s.taskNames==targets && s.excludedTaskNames.empty &&
     s.allInitScripts.size()==1 && s.initScripts.size()==1 && s.includedBuilds.empty && s.writeDependencyVerifications.empty &&
     !s.writeDependencyLocks && s.lockedDependenciesToUpdate.empty &&
     s.projectProperties==['dsha.rebirthCandidate':'true','dsha.identity':'rebirth','dsha.unsignedPackage':'true','dsha.rust.mode':'off',
                           'android.builder.sdkDownload':'false','org.gradle.java.installations.auto-download':'false'], 'INVOCATION')
gradle.settingsEvaluated { st ->
    need(sha(new File(st.settingsDir,'settings.gradle'))=='374e47e50d784456d86537a95716970de0e0c838e614ddf49c6e80064db1e56d' &&
         sha(new File(st.settingsDir,'gradle/verification-metadata.xml'))=='ecd1db829722c4c414e180e4839670e6fe905fb89d171bc53a1a4018d1a49d26', 'SOURCE_PINS')
    def r = st.dependencyResolutionManagement
    need(r.repositoriesMode.get().name()=='FAIL_ON_PROJECT_REPOS', 'PROJECT_REPOSITORY')
    need(r.repositories.collect { it.url.toString() }==['https://dl.google.com/dl/android/maven2/','https://repo.maven.apache.org/maven2/',
        'https://jitpack.io','https://maven.mozilla.org/maven2/'], 'ORIGINAL_REPOSITORIES')
}
gradle.taskGraph.whenReady { graph ->
    def app=gradle.rootProject.project(':app')
    need(app.ext.dshaReleaseIdentity.identity=='rebirth' && app.ext.dshaReleaseIdentity.versionCode==368 &&
         app.android.defaultConfig.applicationId=='dsh.android.client.rebirth', 'IDENTITY')
    def expected = [":app:prepareBackupAssets",":app:verifyRuntimeDescriptorInputs",":app:prepareRuntimeDescriptor",":app:verifyExternalToolProof",":app:prepareStandardAssets",":app:prepareRecoveryAssets",":app:prepareRustNative",":app:prepareUiLanguages",":app:verifyBuiltinRegistry",":app:verifyBundledDshVersion",":app:verifyBundledIdentities",":app:verifyCredentialRegistry",":app:verifyCurrentChangelog",":app:verifyProrootCompat",":app:verifyUiLanguageResources",":app:verifyWebLanguages",":app:preBuild",":app:preStandardReleaseBuild",":app:compileStandardReleaseAidl",":app:generateStandardReleaseBuildConfig",":app:generateStandardReleaseResValues",":app:generateStandardReleaseResources",":app:packageStandardReleaseResources",":app:processStandardReleaseNavigationResources",":app:parseStandardReleaseLocalResources",":app:generateStandardReleaseRFile",":app:compileStandardReleaseKotlin",":app:javaPreCompileStandardRelease",":app:verifyBackupDependencies",":app:compileStandardReleaseJavaWithJavac",":app:extractProguardFiles",":app:extractDeepLinksStandardRelease",":app:processStandardReleaseMainManifest",":app:generateStandardReleaseLintReportModel",":app:lintAnalyzeStandardRelease",":app:lintReportStandardRelease",":app:lintStandardRelease"]
    need(graph.allTasks*.path==expected, 'EXACT_GRAPH')
    println 'B368_PRIVATE_LINT_EXACT_GRAPH=37'
    def report=graph.allTasks.find { it.path==':app:lintReportStandardRelease' }
    def aggregate=graph.allTasks.find { it.path==':app:lintStandardRelease' }
    need(report.class.name.startsWith('com.android.build.gradle.internal.lint.AndroidLintTask') &&
         aggregate.class.name.startsWith('com.android.build.gradle.internal.lint.AndroidLintTextOutputTask'), 'AGP_REPORT_TASKS')
    def out=app.layout.buildDirectory.get().asFile.canonicalFile
    def relative={ f ->
        def path=f.toPath().toAbsolutePath().normalize()
        need(f.canonicalFile.toPath()==path && path.startsWith(out.toPath()) && path!=out.toPath(), 'AGP_REPORT_PATH')
        out.toPath().relativize(path).toString()
    }
    def statusFile=report.returnValueOutputFile.get().asFile
    need(aggregate.returnValueInputFile.get().asFile.canonicalFile==statusFile.canonicalFile && aggregate.abortOnError.get(), 'AGP_REPORT_RESULT_BINDING')
    def paths=[status:relative(statusFile),
               text:aggregate.textReportInputFile.present ? relative(aggregate.textReportInputFile.get().asFile) : null,
               xml:report.xmlReportEnabled.get() ? relative(report.xmlReportOutputFile.get().asFile) : null]
    def manifest=graph.allTasks.find { it.path==':app:processStandardReleaseMainManifest' }
    need(manifest.class.name.startsWith('com.android.build.gradle.tasks.ProcessApplicationManifest'), 'AGP_MANIFEST_TASK')
    def manifestTarget=new File(System.getenv('B368_LINT_DECLARED_OUTPUTS') + '.manifest')
    need(manifestTarget.createNewFile(), 'AGP_MANIFEST_CONTRACT_EXISTS')
    manifestTarget.setText(relative(manifest.mergedManifest.get().asFile)+'\n', 'UTF-8')
    def target=new File(System.getenv('B368_LINT_DECLARED_OUTPUTS'))
    need(target.createNewFile(), 'AGP_REPORT_CONTRACT_EXISTS')
    target.setText(groovy.json.JsonOutput.toJson(paths)+'\n', 'UTF-8')
}
