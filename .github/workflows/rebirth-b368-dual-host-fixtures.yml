name: Rebirth b368 two integrated dual-identity host fixtures
on:
  push:
    branches: [validate/rebirth-b368-dual-host-fixtures]
permissions: {}
jobs:
  verify:
    if: github.repository == '133563825as-ai/DSHA-god' && github.ref == 'refs/heads/validate/rebirth-b368-dual-host-fixtures' && github.event_name == 'push' && github.event.created == true && github.event.before == '0000000000000000000000000000000000000000' && github.event.after == github.sha && github.run_attempt == '1'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Execute the two registered dual-identity host checks
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          set +x
          c=5d70a330e2db7c2c0169dede10ddcf9306e03e70
          t=4bccf473127214b879a1e51ca9aafa394d5afb1d
          p=$(mktemp -d "$RUNNER_TEMP/b368-fast-tools-XXXXXXXX")
          private="$p/private.log"
          stage=SOURCE
          trap 'rc=$?; if ((rc)); then printf "B368_VSCREEN_FAILED_STAGE=%s\nB368_VSCREEN_EXIT=%s\n" "$stage" "$rc"; fi' EXIT
          [[ $(df -PB1 "$p" | awk 'NR==2 {print $4}') -gt $((30*1024*1024*1024)) ]]
          [[ $(awk '/^MemAvailable:/ {print int($2/1024)}' /proc/meminfo) -ge 7168 ]]
          mkdir "$p/home" "$p/tmp"
          export GIT_CONFIG_GLOBAL=/dev/null GIT_CONFIG_NOSYSTEM=1 GIT_TERMINAL_PROMPT=0 GIT_OPTIONAL_LOCKS=0 GIT_NO_LAZY_FETCH=1
          git init -q --template= "$p/src" >"$private" 2>&1
          git -C "$p/src" -c core.hooksPath=/dev/null fetch --quiet --depth 1 --no-tags https://github.com/133563825as-ai/DSHA-god.git "$c" >>"$private" 2>&1
          git -C "$p/src" -c core.hooksPath=/dev/null checkout --quiet --detach FETCH_HEAD >>"$private" 2>&1
          [[ $(git -C "$p/src" rev-parse HEAD) == "$c" && $(git -C "$p/src" rev-parse HEAD^{tree}) == "$t" ]]
          [[ -z $(git -C "$p/src" status --porcelain=v1 --untracked-files=all) && -z $(git -C "$p/src" remote) ]]
          printf 'B368_VSCREEN_SOURCE_COMMIT=%s\nB368_VSCREEN_SOURCE_TREE=%s\n' "$c" "$t"
          stage=TOOLCHAIN
          dl() {
            local url=$1 path=$2 max=$3 pin=$4 code rc=0
            code=$(env -i PATH=/usr/bin:/bin HOME="$p/home" curl --disable -fsSL --retry 2 --retry-delay 3 --retry-max-time 60 --proto '=https' --proto-redir '=https' --max-redirs 4 --max-filesize "$max" --max-time 220 --output "$path" --write-out '%{http_code}' "$url" 2>>"$private") || rc=$?
            [[ "$code" =~ ^[0-9]{3}$ ]]
            printf 'B368_VSCREEN_FETCH=%s:%s:%s\n' "${path##*/}" "$code" "$rc"
            (( rc == 0 )) || return "$rc"
            [[ $(sha256sum "$path" | cut -d' ' -f1) == "$pin" ]]
          }
          dl 'https://github.com/adoptium/temurin17-binaries/releases/download/jdk-17.0.21%2B9/OpenJDK17U-jdk_x64_linux_hotspot_17.0.21_9.tar.gz' "$p/jdk.tgz" 193594705 8b9b611d917e3dfd8419d3566b5949226f69b052fed7e109c1368add1dfe8711
          dl https://nodejs.org/dist/v24.19.0/node-v24.19.0-linux-x64.tar.xz "$p/node.xz" 50000000 14b342e71204f811bde6153be8e04b62aef63c236fef92b55f9c83154b409647
          dl https://dl.google.com/android/repository/platform-37.0_r02.zip "$p/platform.zip" 67281901 840b23e827f96e64aea4c89a1194aac3dc5f6bad37edb231c5c795d890330e8d
          dl https://repo.maven.apache.org/maven2/com/google/code/gson/gson/2.13.1/gson-2.13.1.jar "$p/gson.jar" 400000 94855942d4992f112946d3de1c334e709237b8126d8130bf07807c018a4a2120
          tools="$p/tools"; home="$tools/gradle-user-home"; sdk="$tools/android-sdk"
          gj="$home/caches/modules-2/files-2.1/com.google.code.gson/gson/2.13.1/verified"
          mkdir -p "$gj" "$sdk/platforms"
          mv -T "$p/gson.jar" "$gj/gson-2.13.1.jar"
          unzip -q "$p/platform.zip" -d "$sdk/platforms" >>"$private" 2>&1
          tar -xzf "$p/jdk.tgz" -C "$p" >>"$private" 2>&1
          tar -xJf "$p/node.xz" -C "$p" >>"$private" 2>&1
          [[ -f "$sdk/platforms/android-37.0/android.jar" ]]
          j="$p/jdk-17.0.21+9"; node="$p/node-v24.19.0-linux-x64/bin/node"
          [[ $("$node" --version) == v24.19.0 ]]
          "$j/bin/java" -version >"$p/java.version" 2>&1
          grep -Fq 17.0.21+9 "$p/java.version"
          stage=PROTOCOL_PUBLIC_SUPPLY
          cache="$home/caches/modules-2/files-2.1"; material="$p/material"
          mkdir -p "$material" "$cache/junit/junit/4.13.2/verified" "$cache/org.hamcrest/hamcrest-core/1.3/verified"
          dl https://repo.maven.apache.org/maven2/junit/junit/4.13.2/junit-4.13.2.jar "$cache/junit/junit/4.13.2/verified/junit-4.13.2.jar" 500000 8e495b634469d64fb8acfa3495a065cbacc8a0fff55ce1e31007be4c16dc57d3
          dl https://repo.maven.apache.org/maven2/org/hamcrest/hamcrest-core/1.3/hamcrest-core-1.3.jar "$cache/org.hamcrest/hamcrest-core/1.3/verified/hamcrest-core-1.3.jar" 60000 66fdef91e9739348df7a096aa384a5685f4e875584cce89386a7a47251c4d8e9
          dl https://repo.maven.apache.org/maven2/com/vaadin/external/google/android-json/0.0.20131108.vaadin1/android-json-0.0.20131108.vaadin1.jar "$material/android-json-0.0.20131108.vaadin1.jar" 18279 dfb7bae2f404cfe0b72b4d23944698cb716b7665171812a0a4d0f5926c0fac79
          dl https://dl.google.com/dl/android/maven2/androidx/annotation/annotation-jvm/1.9.1/annotation-jvm-1.9.1.jar "$material/annotation-jvm-1.9.1.jar" 60577 1e343917ebf27ba96fe4dc52b1cad7fd32b738fbc6355bb6cd5b3b305d7212d0
          [[ $(stat -c %s "$material/android-json-0.0.20131108.vaadin1.jar") = 18279 && $(stat -c %s "$material/annotation-jvm-1.9.1.jar") = 60577 ]]
          printf 'B368_VSCREEN_MATERIAL=2\n'
          stage=OFFLINE_PROTOCOL
          u=$(id -u); g=$(id -g); [[ $u != 0 ]]; rc=0
          sudo -n /usr/bin/unshare -n /bin/bash -ec '
            u=$1; g=$2; p=$3; j=$4; node=$5; tools=$6
            /usr/sbin/ip link set lo up
            test "$(/usr/sbin/ip -o link | wc -l)" = 1
            test -z "$(/usr/sbin/ip route show)" && test -z "$(/usr/sbin/ip -6 route show default)"
            cd "$p/src"
            exec /usr/bin/setpriv --reuid="$u" --regid="$g" --clear-groups --no-new-privs /usr/bin/env -i \
              PATH="$j/bin:/usr/bin:/bin" JAVA_HOME="$j" HOME="$p/home" TMPDIR="$p/tmp" LC_ALL=C.UTF-8 GIT_CONFIG_NOSYSTEM=1 GIT_CONFIG_GLOBAL=/dev/null \
              /usr/bin/python3 -sB tools/run-host-tests.py --stage fast --only test-native-device-policy.py --only test-vscreen-protocol.py --vscreen-offline-material "$p/material" \
              --node "$node" --jdk "$j" --toolchain-root "$tools" --output "$p/report"
          ' fast "$u" "$g" "$p" "$j" "$node" "$tools" >"$p/runner.log" 2>&1 || rc=$?
          printf 'B368_VSCREEN_RUNNER_EXIT=%s\n' "$rc"
          stage=READBACK
          [[ $(git -C "$p/src" rev-parse HEAD) == "$c" && $(git -C "$p/src" rev-parse HEAD^{tree}) == "$t" ]]
          [[ -z $(git -C "$p/src" status --porcelain=v1 --untracked-files=all) ]]
          /usr/bin/python3 -IB - "$p" "$rc" 2>>"$private" <<'PY'
          import hashlib,json,re,sys
          from pathlib import Path
          p=Path(sys.argv[1]); rc=int(sys.argv[2]); report=p/'report'; manifest=(report/'manifest.json').read_bytes(); m=json.loads(manifest)
          names=['test-native-device-policy.py','test-vscreen-protocol.py']
          assert m['requestedStage']=='fast' and [x['path'] for x in m['tests']]==['tools/'+n for n in names]
          assert not any(f.suffix in {'.apk','.dex','.aab','.apks'} for f in (p/'src/app/build').rglob('*'))
          for n,row in zip(names,m['tests']):
              log=(report/(n+'.log')).read_bytes(); pin=hashlib.sha256(log).hexdigest()
              assert row['status'] in ('PASS','FAILED') and type(row['exitCode']) is int and pin==row['logSha256']
              print(f'B368_DUAL_CASE={n}:{row["status"]}:{row["exitCode"]}:{pin}')
              if row['status']!='PASS':continue
              assert row['exitCode']==0
              if n==names[0]:
                  counts=re.findall(rb'(?m)^PASS native device dry plans \(rebirth=(false|true)\): ([1-9][0-9]*);',log)
                  assert counts==[(b'false',b'35'),(b'true',b'41')]
              else:
                  ids=re.findall(rb'(?m)^VSCREEN_HOST_IDENTITY=(mod|rebirth)$',log); counts=re.findall(rb'(?m)^OK \(([1-9][0-9]*) tests?\)$',log)
                  assert ids==[b'mod',b'rebirth'] and counts==[b'104',b'84'] and b'NOT_RUN_ANDROID' in log
              for identity,num in zip(('mod','rebirth'),(35,41) if n==names[0] else (104,84)):
                  print(f'B368_DUAL_COUNT={n}:{identity}:{num}')
          assert (m['status']=='PASS_FOR_SELECTED_STAGES' and not m['failures'])==(rc==0)
          print('B368_DUAL_MANIFEST_SHA256='+hashlib.sha256(manifest).hexdigest())
          PY
          printf 'B368_FORMAL_ADMISSION=false\n'
          (( rc == 0 )) || exit "$rc"
