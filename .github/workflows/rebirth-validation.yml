name: Rebirth RC1 Ubuntu tests only

# 首次验证由独立分支push触发；不依赖default尚未登记的新workflow_dispatch。
on:
  push:
    branches: ['validate/rebirth-rc1-20261114']
permissions:
  contents: read
concurrency:
  group: rebirth-validation-${{ github.ref }}
  cancel-in-progress: false
jobs:
  gates:
    if: github.event_name == 'push' && github.repository == '133563825as-ai/DSHA-god' && github.ref == 'refs/heads/validate/rebirth-rc1-20261114'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      GRADLE_USER_HOME: ${{ github.workspace }}/.gradle-ci
      DSHA_PYTHON: python3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: ./.github/actions/setup-toolchain
        with:
          gradle-cache: 'false'
      - uses: ./.github/actions/android-sdk
        with:
          ndk: 'true'
      - name: Current frozen binary inputs and native x64 host fixtures
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out/rebirth-validation
          git rev-parse HEAD > out/rebirth-validation/source-commit.txt
          python3 tools/prepare-validation-inputs.py --url 'https://github.com/SunsetRNE/DSHA-Sunset-mod/releases/download/fixed-inputs-20261105e/dsha-a-su-fixed-inputs-20261105e.zip' --sha256 be97d9f0a45f408d3a7de83ae55a00a85a5154343589571c6d159a0fe58f08f5 --report out/rebirth-validation/input-receipt.json
          # 保留冻结ARM64归档；只建立当前Linux x64 npm原生测试依赖，不重建发行归档。
          python3 tools/prepare-test-runtime.py --platform host
          python3 - <<'PY'
          import json, os, pathlib
          pointer = json.loads(pathlib.Path('app/build/test-runtimes/current.json').read_text())
          if pointer['platform'] != {'os': 'linux', 'cpu': 'x64'} or pointer['archiveCurrent'] is not True:
              raise SystemExit('CURRENT_NATIVE_HOST_FIXTURE_REQUIRED')
          with open(os.environ['GITHUB_ENV'], 'a') as out:
              out.write('DSHA_TEST_RUNTIME=' + pointer['raw'] + '\n')
              out.write('DSHA_TEST_MANAGED_RUNTIME=' + pointer['managed'] + '\n')
              out.write('DSHA_ROBOLECTRIC_DEPENDENCY_DIR=' + os.environ['RUNNER_TEMP'] + '/robolectric-deps\n')
              out.write('PLAYWRIGHT_BROWSERS_PATH=' + os.environ['RUNNER_TEMP'] + '/rebirth-browsers\n')
          PY
          python3 tools/prepare-semver-reference.py
          npm ci --prefix tools/ci-browser --ignore-scripts --no-audit --no-fund
          export PLAYWRIGHT_BROWSERS_PATH="$RUNNER_TEMP/rebirth-browsers"
          node tools/ci-browser/node_modules/playwright/cli.js install --with-deps chromium
          python3 tools/prepare-browser-react-reference.py
          python3 tools/prepare-sprout-host-jars.py --prepare
          python3 tools/prepare-sprout-host-jars.py --check
          python3 tools/test-vscreen-manager-http.py --self-test
      - name: Trusted Ubuntu Gradle task graph fence and host dependency preparation
        shell: bash
        run: |
          set -euo pipefail
          # 本机tools/dsha-gradle是诊断拒绝器，不能用于独立Ubuntu CI执行项目任务。
          # 全新CI home仅安装此固定受管init；它同时约束software脚本内部wrapper。
          mkdir -p "$GRADLE_USER_HOME/init.d"
          cat > "$GRADLE_USER_HOME/init.d/rebirth-gates.gradle" <<'GRADLE'
          gradle.startParameter.setParallelProjectExecutionEnabled(false)
          gradle.startParameter.setMaxWorkerCount(2)
          gradle.taskGraph.whenReady { graph ->
            def forbidden = graph.allTasks.findAll { t ->
              def n = t.name
              def type = t.class.name
              // packageStandard*Resources是aapt资源输入，不是APK，不能泛禁所有package前缀。
              n ==~ /(?i)(assemble|publish|install|uninstall|clean|sign|validateSigning).*/ ||
              n ==~ /(?i)(package|bundle)Standard(Debug|Release)(AndroidTest)?/ ||
              n ==~ /(?i)(package|bundle).*AndroidTest.*/ ||
              type.contains('PackageApplication') || type.contains('PackageAndroidArtifact') ||
              type.contains('FinalizeBundleTask') || type.contains('PackageBundleTask')
            }
            if (!forbidden.empty) throw new GradleException('TEST_ONLY_FORBIDS_ARTIFACT_TASKS: ' + forbidden*.path)
          }
          gradle.projectsEvaluated {
            rootProject.allprojects { p ->
              p.tasks.withType(org.gradle.api.tasks.testing.Test).configureEach { t ->
                t.maxParallelForks = 1
                // 保持生产全套Robolectric需要的2GiB，不因CI包装降低原测试预算。
                t.maxHeapSize = '2048m'
              }
            }
          }
          GRADLE
          # 只覆盖CI临时home，不改源码gradle.properties或Android SDK。
          cat > "$GRADLE_USER_HOME/gradle.properties" <<'PROPERTIES'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          org.gradle.daemon=false
          org.gradle.parallel=false
          org.gradle.workers.max=2
          PROPERTIES
          cat > "$RUNNER_TEMP/rebirth-host-deps.init.gradle" <<'GRADLE'
          allprojects {
            if (project.path == ':app') {
              configurations.create('rebirthHostFixtures') { transitive = false }
              dependencies {
                rebirthHostFixtures 'junit:junit:4.13.2'
                rebirthHostFixtures 'org.hamcrest:hamcrest-core:1.3'
                rebirthHostFixtures 'com.google.code.gson:gson:2.13.1'
                rebirthHostFixtures 'org.yaml:snakeyaml:2.4'
                rebirthHostFixtures 'org.bouncycastle:bcprov-jdk15to18:1.85.2'
                rebirthHostFixtures 'androidx.annotation:annotation-jvm:1.9.1'
              }
              tasks.register('prepareRebirthHostFixtures') {
                doLast { configurations.rebirthHostFixtures.files.each { println it } }
              }
            }
          }
          GRADLE
          bash gradlew --version --no-daemon
          bash gradlew :app:prepareRebirthHostFixtures -I "$RUNNER_TEMP/rebirth-host-deps.init.gradle" --no-daemon --max-workers=2
          mkdir -p "$RUNNER_TEMP/rebirth-toolchains"
          ln -s "$ANDROID_HOME" "$RUNNER_TEMP/rebirth-toolchains/android-sdk"
          ln -s "$GRADLE_USER_HOME" "$RUNNER_TEMP/rebirth-toolchains/gradle-user-home"
          python3 - <<'PY'
          import os, pathlib, tarfile
          out = pathlib.Path(os.environ['RUNNER_TEMP']) / 'rebirth-pnpm'
          out.mkdir()
          prefix = 'usr/local/lib/dsha-pnpm/'
          with tarfile.open('app/src/main/assets/pnpm-runtime.bin', 'r:gz') as archive:
              for item in archive:
                  name = item.name.removeprefix('./')
                  if not name.startswith(prefix):
                      continue
                  relative = pathlib.PurePosixPath(name[len(prefix):])
                  if relative.is_absolute() or '..' in relative.parts or item.issym() or item.islnk():
                      raise SystemExit('UNSAFE_PNPM_MEMBER')
                  if item.isfile():
                      target = out / str(relative)
                      target.parent.mkdir(parents=True, exist_ok=True)
                      with target.open('xb') as stream:
                          stream.write(archive.extractfile(item).read())
          if not (out / 'dist/pnpm.cjs').is_file():
              raise SystemExit('PNPM_CLI_MISSING')
          PY
      - name: L1 identity source and complete fast gates
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/test-release-identity.py 2>&1 | tee out/rebirth-validation/identity-tests.log
          python3 tools/release-identity.py --check
          python3 tools/prepare-runtime-descriptor.py --check
          python3 tools/run-host-tests.py --check-manifest
          python3 tools/check-source-hygiene.py
          python3 tools/check-ui-i18n.py
          python3 tools/localize-android-ui.py --resources-only --check
          python3 tools/generate-changelog.py --check
          python3 tools/check-document-links.py
          python3 tools/format-java.py --check --files app/src/main/java/com/deepseekharness/app/backup/RetainedCatalogue.java app/src/main/java/com/deepseekharness/app/core/StartupPipeline.java app/src/main/java/com/deepseekharness/app/core/WebLifecycleController.java app/src/main/java/com/deepseekharness/app/core/WebReadyTasks.java app/src/main/java/com/deepseekharness/app/runtime/GuestPluginScripts.java app/src/main/java/com/deepseekharness/app/runtime/Rc1MigrationCache.java app/src/main/java/com/deepseekharness/app/runtime/RuntimeTools.java app/src/main/java/com/deepseekharness/app/util/ManagedPatchChain.java app/src/main/java/com/deepseekharness/app/util/Rc1MigrationResult.java app/src/main/java/com/deepseekharness/app/util/Rc1MigrationReuse.java app/src/test/java/com/deepseekharness/app/backup/RetainedCatalogueTest.java app/src/test/java/com/deepseekharness/app/core/StartupPipelineTest.java app/src/test/java/com/deepseekharness/app/core/WebLifecycleStartProtectionTest.java app/src/test/java/com/deepseekharness/app/core/WebReadyTasksTest.java app/src/test/java/com/deepseekharness/app/runtime/GuestPluginScriptsTest.java app/src/test/java/com/deepseekharness/app/runtime/Rc1MigrationCacheTest.java app/src/test/java/com/deepseekharness/app/util/ManagedPatchChainTest.java app/src/test/java/com/deepseekharness/app/util/Rc1MigrationResultTest.java app/src/test/java/com/deepseekharness/app/util/Rc1MigrationReuseTest.java --report app/build/java-format/rebirth-ci.json
          python3 tools/run-host-tests.py --stage fast --raw "$DSHA_TEST_RUNTIME" --managed "$DSHA_TEST_MANAGED_RUNTIME" --jdk "$JAVA_HOME" --toolchain-root "$RUNNER_TEMP/rebirth-toolchains" --pnpm-cli "$RUNNER_TEMP/rebirth-pnpm/dist/pnpm.cjs" --output app/build/host-fast-rebirth-ci 2>&1 | tee out/rebirth-validation/host-fast.log
      - name: L2 complete unit XML Lint and resource source map
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/prepare-robolectric-sdks.py --dir "$DSHA_ROBOLECTRIC_DEPENDENCY_DIR"
          bash gradlew :app:testStandardDebugUnitTest --rerun-tasks --no-daemon --max-workers=2 2>&1 | tee out/rebirth-validation/unit.log
          python3 tools/verify-unit-results.py --mode full --require-fixtures --output out/rebirth-validation/unit-results.json
          bash gradlew :app:lintStandardRelease --no-daemon --max-workers=2 2>&1 | tee out/rebirth-validation/lint.log
          bash gradlew :app:mapStandardReleaseSourceSetPaths --no-daemon --max-workers=2 2>&1 | tee out/rebirth-validation/resource-source-map.log
      - name: L3 complete runtime and software gates
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import importlib.util, os, pathlib, urllib.request
          spec = importlib.util.spec_from_file_location('previous_fixture', 'tools/previous-runtime-fixture.py')
          fixture = importlib.util.module_from_spec(spec); spec.loader.exec_module(fixture)
          source = pathlib.Path(os.environ['RUNNER_TEMP']) / 'rebirth-previous-runtime.apk'
          if source.exists():
              raise SystemExit('HISTORICAL_FIXTURE_TARGET_EXISTS')
          request = urllib.request.Request(fixture.CONTRACT.url, headers={'User-Agent': 'DSHA-Rebirth-Test-CI'})
          with urllib.request.urlopen(request, timeout=60) as response, source.open('xb') as output:
              size = 0
              while True:
                  chunk = response.read(1024 * 1024)
                  if not chunk:
                      break
                  size += len(chunk)
                  if size > 512 * 1024 * 1024:
                      raise SystemExit('HISTORICAL_FIXTURE_SIZE_LIMIT')
                  output.write(chunk)
          fixture.verify_apk(source)
          PY
          python3 tools/run-host-tests.py --stage runtime --raw "$DSHA_TEST_RUNTIME" --managed "$DSHA_TEST_MANAGED_RUNTIME" --jdk "$JAVA_HOME" --toolchain-root "$RUNNER_TEMP/rebirth-toolchains" --pnpm-cli "$RUNNER_TEMP/rebirth-pnpm/dist/pnpm.cjs" --previous-runtime-apk "$RUNNER_TEMP/rebirth-previous-runtime.apk" --playwright "$GITHUB_WORKSPACE/tools/ci-browser/node_modules/playwright" --browsers-path "$PLAYWRIGHT_BROWSERS_PATH" --output app/build/host-runtime-rebirth-ci 2>&1 | tee out/rebirth-validation/host-runtime.log
          python3 tools/verify-stability.py --stage software --java-home "$JAVA_HOME" --sdk "$ANDROID_HOME" --test-forks 1 2>&1 | tee out/rebirth-validation/software.log
      - name: Upload test evidence only including failures
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rebirth-validation-test-evidence
          path: |
            out/rebirth-validation/*.log
            out/rebirth-validation/*.json
            out/rebirth-validation/*.txt
            app/build/host-fast-rebirth-ci/*.log
            app/build/host-fast-rebirth-ci/manifest.json
            app/build/host-runtime-rebirth-ci/*.log
            app/build/host-runtime-rebirth-ci/manifest.json
            app/build/test-results/**/*.xml
            app/build/reports/lint-results-*.html
            app/build/reports/lint-results-*.xml
            app/build/stability-acceptance/*/*.log
            app/build/stability-acceptance/*/manifest.json
            app/build/stability-acceptance/*/source-sha256.json
          if-no-files-found: warn
          retention-days: 14
