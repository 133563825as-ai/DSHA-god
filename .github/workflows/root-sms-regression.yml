name: Root SMS revocation regression
on:
  push:
    branches: ['codex/root-sms-revocation-20261122']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inputs:
    uses: ./.github/workflows/_node-inputs.yml
    with:
      rebuild_runtime: true
      artifact: root-sms-inputs
  focused-root:
    needs: inputs
    uses: ./.github/workflows/_node-unit-tests.yml
    with:
      mode: source-only
      handoff: ${{ needs.inputs.outputs.artifact }}
      sunset_test: false
      tests: >-
        com.deepseekharness.app.RootShellRequestGateTest
        com.deepseekharness.app.core.ConfigStoreRootRequestTest
        com.deepseekharness.app.core.DeviceGrantsTest
        com.deepseekharness.app.util.RootRequestGateTest
        com.deepseekharness.app.util.RootSettingsAuthorityTest
      artifact: root-sms-regression-results
  device-candidate:
    if: contains(github.event.head_commit.message, '[device-build]')
    needs: [inputs, focused-root]
    uses: ./.github/workflows/_node-test-packages.yml
    with:
      variants: dev
      release_identity: upstream
      unsigned_only: true
      handoff: ${{ needs.inputs.outputs.artifact }}
      artifact_prefix: root-sms-device
      unit_tests_run: false
      patch_chains_run: false
  canonical-candidates:
    needs: inputs
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-toolchain
      - uses: ./.github/actions/restore-handoff
        with:
          artifact: ${{ needs.inputs.outputs.artifact }}
          fixture: 'true'
      - name: Generate canonical source and descriptor candidates
        run: |
          python3 tools/format-java-tree.py --write
          python3 tools/prepare-runtime-descriptor.py
          mkdir -p out/root-sms-canonical
          cp app/src/main/java/com/deepseekharness/app/RootShell.java out/root-sms-canonical/RootShell.java
          cp app/src/main/java/com/deepseekharness/app/core/ConfigStore.java out/root-sms-canonical/ConfigStore.java
          cp app/src/main/java/com/deepseekharness/app/core/DeviceGrants.java out/root-sms-canonical/DeviceGrants.java
          cp app/src/test/java/com/deepseekharness/app/RootShellRequestGateTest.java out/root-sms-canonical/RootShellRequestGateTest.java
          cp app/src/test/java/com/deepseekharness/app/core/ConfigStoreRootRequestTest.java out/root-sms-canonical/ConfigStoreRootRequestTest.java
          cp app/src/test/java/com/deepseekharness/app/core/DeviceGrantsTest.java out/root-sms-canonical/DeviceGrantsTest.java
          cp app/src/main/assets/runtime-descriptor.json out/root-sms-canonical/runtime-descriptor.json
          git diff --stat > out/root-sms-canonical/changes.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: root-sms-canonical-candidates
          path: out/root-sms-canonical/
          if-no-files-found: error
