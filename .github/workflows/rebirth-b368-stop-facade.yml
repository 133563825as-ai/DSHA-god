name: Rebirth b368 stop facade source check
on:
  push:
    branches: [validate/rebirth-b368-stop-facade]
permissions: {}
jobs:
  verify:
    if: github.repository == '133563825as-ai/DSHA-god' && github.ref == 'refs/heads/validate/rebirth-b368-stop-facade' && github.event_name == 'push' && github.event.created == true && github.event.before == '0000000000000000000000000000000000000000' && github.event.after == github.sha && github.run_attempt == '1'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Execute the unchanged facade boundary and descriptor source checks
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          set +x
          c=265d370d72c2ecce2e210e836ca9f1da895026e4
          t=5679b579f3f8d908d44fa7203ad0313d579318ba
          p=$(mktemp -d "$RUNNER_TEMP/b368-fast-tools-XXXXXXXX")
          private="$p/private.log"
          stage=SOURCE
          trap 'rc=$?; if ((rc)); then printf "B368_FACADE_FAILED_STAGE=%s\nB368_FACADE_EXIT=%s\n" "$stage" "$rc"; fi' EXIT
          [[ $(df -PB1 "$p" | awk 'NR==2 {print $4}') -gt $((30*1024*1024*1024)) ]]
          [[ $(awk '/^MemAvailable:/ {print int($2/1024)}' /proc/meminfo) -ge 7168 ]]
          mkdir "$p/home" "$p/tmp"
          export GIT_CONFIG_GLOBAL=/dev/null GIT_CONFIG_NOSYSTEM=1 GIT_TERMINAL_PROMPT=0 GIT_OPTIONAL_LOCKS=0 GIT_NO_LAZY_FETCH=1
          git init -q --template= "$p/src" >"$private" 2>&1
          git -C "$p/src" -c core.hooksPath=/dev/null fetch --quiet --depth 1 --no-tags https://github.com/133563825as-ai/DSHA-god.git "$c" >>"$private" 2>&1
          git -C "$p/src" -c core.hooksPath=/dev/null checkout --quiet --detach FETCH_HEAD >>"$private" 2>&1
          [[ $(git -C "$p/src" rev-parse HEAD) == "$c" && $(git -C "$p/src" rev-parse HEAD^{tree}) == "$t" ]]
          [[ -z $(git -C "$p/src" status --porcelain=v1 --untracked-files=all) && -z $(git -C "$p/src" remote) ]]
          printf 'B368_FACADE_SOURCE_COMMIT=%s\nB368_FACADE_SOURCE_TREE=%s\n' "$c" "$t"
          stage=OFFLINE_SOURCE
          u=$(id -u); g=$(id -g); [[ $u != 0 ]]
          sudo -n /usr/bin/unshare -n /bin/bash -ec '
            u=$1; g=$2; p=$3
            /usr/sbin/ip link set lo up
            test "$(/usr/sbin/ip -o link | wc -l)" = 1
            test -z "$(/usr/sbin/ip route show)" && test -z "$(/usr/sbin/ip -6 route show default)"
            cd "$p/src"
            /usr/bin/setpriv --reuid="$u" --regid="$g" --clear-groups --no-new-privs /usr/bin/env -i PATH=/usr/bin:/bin HOME="$p/home" TMPDIR="$p/tmp" LC_ALL=C.UTF-8 /usr/bin/python3 -sB tools/test-core-boundaries.py >"$p/boundary.log" 2>&1
            /usr/bin/setpriv --reuid="$u" --regid="$g" --clear-groups --no-new-privs /usr/bin/env -i PATH=/usr/bin:/bin HOME="$p/home" TMPDIR="$p/tmp" LC_ALL=C.UTF-8 /usr/bin/python3 -sB tools/verify-runtime-descriptor-source.py >"$p/descriptor.log" 2>&1
          ' verify "$u" "$g" "$p" >>"$private" 2>&1
          stage=SOURCE_READBACK
          test -z "$(git -C "$p/src" status --porcelain=v1 --untracked-files=all)"
          test ! -e "$p/src/app/build"
          /usr/bin/python3 -IB - "$p" >>"$private" 2>&1 <<'PY'
          import hashlib,json,re,sys
          from pathlib import Path
          p=Path(sys.argv[1]); b=(p/'boundary.log').read_bytes(); d=(p/'descriptor.log').read_bytes(); r=json.loads(d)
          assert re.search(rb'(?m)^Ran 25 tests in ',b) and b.rstrip().endswith(b'\nOK')
          assert (r['checkedAssets'],r['checkedLaunchers'],len(r['deferredArchives']))==(199,520,6)
          f=p/'src/app/src/main/java/com/deepseekharness/app/core/HarnessController.java'; assert len(f.read_bytes().splitlines())==299
          (p/'summary').write_text('B368_FACADE_TESTS=25\nB368_FACADE_LINES=299\nB368_FACADE_DESCRIPTOR=199:520:6\nB368_FACADE_BOUNDARY_SHA256='+hashlib.sha256(b).hexdigest()+'\nB368_FACADE_DESCRIPTOR_SHA256='+hashlib.sha256(d).hexdigest()+'\n')
          PY
          grep -Ex 'B368_FACADE_(TESTS=25|LINES=299|DESCRIPTOR=199:520:6|BOUNDARY_SHA256=[a-f0-9]{64}|DESCRIPTOR_SHA256=[a-f0-9]{64})' "$p/summary"
          printf 'B368_FACADE=PASS\nB368_FORMAL_ADMISSION=false\n'
