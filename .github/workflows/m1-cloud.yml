name: Fake-only settings navigation narrow validation
on:
  push:
    branches: [validate/m1-cloud-20261124]
permissions:
  contents: read
concurrency:
  group: m1-once-${{ github.ref }}
  cancel-in-progress: false
jobs:
  admission:
    if: github.repository == '133563825as-ai/DSHA-god' && github.event_name == 'push' && github.ref == 'refs/heads/validate/m1-cloud-20261124' && github.event.before == 'b3e2ebaf304552817e0e9c952ca0d1c50828cf49' && github.event.after == github.sha && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 14
          persist-credentials: false
      - run: python3 ci/m1-cloud/verify.py candidate
  inputs:
    needs: admission
    uses: ./.github/workflows/_node-inputs.yml
    with:
      ref: ${{ github.sha }}
      rebuild_runtime: false
      artifact: m1-fixed-inputs-${{ github.run_id }}-${{ github.run_attempt }}
    permissions:
      contents: read
  narrow:
    needs: [admission, inputs]
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      DSHA_PYTHON: /usr/bin/python3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 14
          persist-credentials: false
      - name: Verify one-time candidate identity
        run: python3 ci/m1-cloud/verify.py candidate
      - uses: ./.github/actions/setup-toolchain
        with:
          gradle-cache: 'false'
      - uses: ./.github/actions/android-sdk
        with:
          ndk: 'false'
      - name: Verify candidate Git metadata before handoff
        run: python3 ci/m1-cloud/verify.py metadata-checkout
      - uses: ./.github/actions/restore-handoff
        with:
          artifact: ${{ needs.inputs.outputs.artifact }}
          fixture: 'false'
      - name: Restore candidate Git metadata and recheck original archive pins
        run: python3 ci/m1-cloud/verify.py metadata-restore
      - name: Verify protected pins and record bounded actual tool versions
        run: |
          python3 ci/m1-cloud/verify.py protected
          java -version
          javac -version
          python3 --version
      - name: Compile only
        run: python3 ci/m1-cloud/verify.py phase compile
      - name: Exact fake navigation and controller JVM methods
        run: python3 ci/m1-cloud/verify.py phase jvm
      - name: Fetch and verify only SDK34
        timeout-minutes: 6
        run: python3 ci/m1-cloud/verify.py sdk34
      - name: Exact fake navigation and independent display SDK34 methods
        run: python3 ci/m1-cloud/verify.py phase about
      - name: Finalize missing receipts as UNKNOWN (never infer success)
        if: always()
        run: python3 ci/m1-cloud/verify.py finalize
      - name: Upload structural evidence only (never raw logs, source, env or binaries)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: m1-safe-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/m1-safe-evidence/compile/result.json
            ${{ runner.temp }}/m1-safe-evidence/jvm/result.json
            ${{ runner.temp }}/m1-safe-evidence/about/result.json
            ${{ runner.temp }}/m1-safe-evidence/jvm/filtered-junit.xml
            ${{ runner.temp }}/m1-safe-evidence/about/filtered-junit.xml
          retention-days: 1
          if-no-files-found: warn
          compression-level: 0
