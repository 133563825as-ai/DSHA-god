name: Rebirth N1 startup one-time SDK34 narrow validation
on:
  push:
    branches: [validate/m1-cloud-20261124]
permissions:
  contents: read
concurrency:
  group: m1-once-${{ github.ref }}
  cancel-in-progress: false
jobs:
  admission:
    if: github.repository == '133563825as-ai/DSHA-god' && github.event_name == 'push' && github.ref == 'refs/heads/validate/m1-cloud-20261124' && github.event.before == 'e03a4dea89c5ed327c50e0eb26076d263194f45e' && github.event.after == github.sha && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 34
          persist-credentials: false
      - run: python3 ci/m1-cloud/verify.py candidate
  narrow:
    needs: admission
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      DSHA_PYTHON: /usr/bin/python3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 34
          persist-credentials: false
      - name: Verify one-time candidate identity
        run: python3 ci/m1-cloud/verify.py candidate
      - uses: ./.github/actions/setup-toolchain
        with:
          gradle-cache: 'false'
      - uses: ./.github/actions/android-sdk
        with:
          ndk: 'false'
      - name: Verify candidate Git metadata before handoff
        run: python3 ci/m1-cloud/verify.py metadata-checkout
      - name: Resolve the same locked fixed input pair (no override or rebuild)
        id: resolve
        env:
          SUNSET_DISPATCH_URL: ''
          SUNSET_DISPATCH_SHA: ''
          SUNSET_DISPATCH_FORMAT: ''
        run: python3 tools/sunset-ci-inputs.py --github-output
      - name: Restore exact fixed inputs locally (never upload input assets)
        env:
          INPUT_URL: ${{ steps.resolve.outputs.url }}
          INPUT_SHA: ${{ steps.resolve.outputs.sha256 }}
          INPUT_FORMAT: ${{ steps.resolve.outputs.format }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          args=(--url "$INPUT_URL" --sha256 "$INPUT_SHA")
          if [ "$INPUT_FORMAT" = source-archive ]; then args+=(--source-archive); fi
          python3 tools/ci-assets.py "${args[@]}"
      - name: Restore candidate metadata before packing; recheck original archive pins
        run: python3 ci/m1-cloud/verify.py metadata-restore
      - name: Verify local same-SHA handoff without publishing its binary archive
        run: |
          python3 tools/ci-handoff.py pack --dir "$RUNNER_TEMP/dsha-handoff" --commit "$GITHUB_SHA"
          python3 tools/ci-handoff.py unpack --dir "$RUNNER_TEMP/dsha-handoff" --commit "$GITHUB_SHA"
          python3 ci/m1-cloud/verify.py metadata-handoff
          python3 tools/verify-runtime-descriptor-source.py
      - name: Verify protected pins and record bounded actual tool versions
        run: |
          python3 ci/m1-cloud/verify.py protected
          java -version
          javac -version
          python3 --version
      - name: Compile only
        run: python3 ci/m1-cloud/verify.py phase compile
      - name: Fetch and verify only SDK34
        timeout-minutes: 9
        run: python3 ci/m1-cloud/verify.py sdk34
      - name: Exact five authorized N1 startup SDK34 methods
        run: python3 ci/m1-cloud/verify.py phase about
      - name: Finalize missing receipts as UNKNOWN (never infer success)
        if: always()
        run: python3 ci/m1-cloud/verify.py finalize
      - name: Upload structural evidence only (never raw logs, source, env or binaries)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: m1-safe-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/m1-safe-evidence/compile/result.json
            ${{ runner.temp }}/m1-safe-evidence/about/result.json
            ${{ runner.temp }}/m1-safe-evidence/about/filtered-junit.xml
          retention-days: 1
          if-no-files-found: warn
          compression-level: 0
