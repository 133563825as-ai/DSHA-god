name: Root helper device instrumentation candidate
on:
  push:
    branches: [codex/root-helper-device-20261123]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inputs:
    uses: ./.github/workflows/_node-inputs.yml
    with:
      rebuild_runtime: true
  instrumentation:
    needs: inputs
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-toolchain
      - uses: ./.github/actions/android-sdk
        with:
          ndk: 'true'
      - uses: ./.github/actions/restore-handoff
        with:
          artifact: ${{ needs.inputs.outputs.artifact }}
      - name: Canonicalize test-only Java and build instrumentation
        run: |
          set -euf
          python3 tools/format-java-tree.py --write
          mkdir -p out/root-helper-device
          cp app/src/androidTest/java/com/deepseekharness/app/RootHandoverInstrumentation.java out/root-helper-device/
          cp app/src/androidTest/java/com/deepseekharness/app/core/RecoveryInstrumentation.java out/root-helper-device/
          git diff --stat > out/root-helper-device/formatting-diff.txt
          printf '%s\n' "$GITHUB_SHA" > out/root-helper-device/source-commit.txt
          chmod +x gradlew
          ./gradlew :app:assembleStandardDebugAndroidTest -Pdsha.devPackage=true -Pdsha.unsignedPackage=true -Pdsha.identity=upstream -Pdsha.testRunner=com.deepseekharness.app.RootHandoverInstrumentation --no-daemon --max-workers=2
          python3 - <<'PYCODE'
          from pathlib import Path
          import shutil
          apks = [p for p in Path('app/build/outputs').rglob('*.apk') if 'androidtest' in str(p).lower()]
          if len(apks) != 1:
              raise SystemExit('EXPECTED_ONE_INSTRUMENTATION_APK: ' + repr([str(p) for p in apks]))
          shutil.copyfile(apks[0], Path('out/root-helper-device') / apks[0].name)
          Path('out/root-helper-device/apk-output-path.txt').write_text(str(apks[0]) + '\n')
          PYCODE
          sha256sum out/root-helper-device/*.apk > out/root-helper-device/SHA256SUMS.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: root-helper-device-instrumentation
          path: out/root-helper-device/
          if-no-files-found: error
