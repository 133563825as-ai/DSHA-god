name: Rebirth b368 stop-facade offline lint verification
on:
  push:
    branches: [validate/rebirth-b368-facade-lint]
permissions: {}
jobs:
  restore:
    if: github.repository == '133563825as-ai/DSHA-god' && github.ref == 'refs/heads/validate/rebirth-b368-facade-lint' && github.event_name == 'push' && github.event.after == github.sha && github.run_attempt == '1' && github.event.created == true && github.event.before == '0000000000000000000000000000000000000000'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Reconstruct and lint the exact b368 source
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          set +x
          p=$(mktemp -d "$RUNNER_TEMP/b368-restore-XXXXXXXX")
          c=265d370d72c2ecce2e210e836ca9f1da895026e4
          t=5679b579f3f8d908d44fa7203ad0313d579318ba
          hash=2c8dc3fa494a5faf6f65cafa966b47d234a3331c30396198005cedfccca82cad
          url=https://github.com/SunsetRNE/DSHA-Sunset-mod/releases/download/fixed-inputs-20261113/dsha-a-su-fixed-inputs-20261113-build364.zip
          stage=SOURCE
          out="$p/private.log"
          trap 'rc=$?; if (( rc != 0 )); then printf "B368_RESTORE_FAILED_STAGE=%s\nB368_RESTORE_EXIT=%s\n" "$stage" "$rc"; fi' EXIT
          [[ $(df -PB1 "$p" | awk 'NR==2 {print $4}') -gt $((30*1024*1024*1024)) ]]
          env -i PATH=/usr/bin:/bin HOME="$p" GIT_CONFIG_NOSYSTEM=1 GIT_CONFIG_GLOBAL=/dev/null GIT_TERMINAL_PROMPT=0 \
            bash -euc '
              git init -q --template= "$1/src"
              git -C "$1/src" -c core.hooksPath=/dev/null fetch --quiet --no-tags --depth 1 https://github.com/133563825as-ai/DSHA-god.git "$2"
              git -C "$1/src" -c core.hooksPath=/dev/null checkout --quiet --detach FETCH_HEAD
              test "$(git -C "$1/src" rev-parse HEAD)" = "$2"
              test "$(git -C "$1/src" rev-parse HEAD^{tree})" = "$3"
              test -z "$(git -C "$1/src" status --porcelain=v1 --untracked-files=all)"
              test -z "$(git -C "$1/src" remote)"
            ' verify "$p" "$c" "$t" >"$out" 2>&1
          printf 'B368_LINT_SOURCE_COMMIT=%s\nB368_LINT_SOURCE_TREE=%s\n' "$c" "$t"
          stage=DOWNLOAD
          env -i PATH=/usr/bin:/bin HOME="$p" curl --disable --silent --show-error --fail --location \
            --proto '=https' --proto-redir '=https' --max-redirs 4 --max-filesize 716787167 --max-time 360 \
            --output "$p/fixed.zip" "$url" >>"$out" 2>&1
          stage=PIN
          [[ $(stat -c %s "$p/fixed.zip") = 716787167 ]]
          [[ $(sha256sum "$p/fixed.zip" | cut -d' ' -f1) = "$hash" ]]
          stage=SET
          env -i PATH=/usr/bin:/bin HOME="$p" python3 -IB - "$p/fixed.zip" "$p/src" "$hash" "$url" >>"$out" 2>&1 <<'PY'
          import json, pathlib, sys, zipfile
          archive, source, pin, url = sys.argv[1:]
          lock = json.loads((pathlib.Path(source) / 'ci/sunset-inputs.lock.json').read_bytes())
          assert (lock['url'], lock['sha256'], lock['bytes'], lock['format']) == (url, pin, 716787167, 'bundle')
          with zipfile.ZipFile(archive) as z:
              names = z.namelist()
              assert len(names) == len(set(names)) == 12
              assert not any(name.lower().endswith(('.apk', '.aab', '.apks')) for name in names)
          PY
          stage=ORIGINAL_RESTORE
          cd "$p/src"
          env -i PATH=/usr/bin:/bin HOME="$p" LC_ALL=C.UTF-8 /usr/bin/python3 -sB tools/ci-assets.py \
            --archive "$p/fixed.zip" --sha256 "$hash" >>"$out" 2>&1
          grep -Fxq 'PASS locked CI asset inputs; source builders must verify their own recipe metadata' "$out"
          stage=WORKER
          env -i PATH=/usr/bin:/bin HOME="$p" GIT_CONFIG_NOSYSTEM=1 GIT_CONFIG_GLOBAL=/dev/null GIT_TERMINAL_PROMPT=0 bash -euc '
            git init -q --template= "$1/worker"
            git -C "$1/worker" fetch --quiet --no-tags --depth 1 https://github.com/133563825as-ai/DSHA-god.git "$2"
            test "$(git -C "$1/worker" rev-parse FETCH_HEAD)" = "$2"
            git -C "$1/worker" show FETCH_HEAD:online_b368_inputs.py > "$1/online_b368_inputs.py"
            git -C "$1/worker" show FETCH_HEAD:seed.cjs > "$1/seed.cjs"
            for f in online_b368_compile_supply.init.gradle online_b368_compile_guard.init.gradle online_b368_compile_monitor.py online_b368_retry_429.py online_b368_compile_diagnostics.py online_b368_lint_guard.init.gradle online_b368_lint_supply.init.gradle online_b368_lint_diagnostics.py online_b368_lint_report.py verify_b368_merged_permission.py baseline-runtime-descriptor.json; do
              git -C "$1/worker" show "FETCH_HEAD:$f" > "$1/$f"
            done
          ' worker "$p" "$GITHUB_SHA" >>"$out" 2>&1
          [[ $(sha256sum "$p/seed.cjs" | cut -d' ' -f1) = c1de8dcc8c727c71539793c9ce94bf735aa7c68bd6560af42f6f8c5fffed0c95 ]]
          stage=NODE
          env -i PATH=/usr/bin:/bin HOME="$p" curl --disable --silent --show-error --fail --proto '=https' --max-filesize 50000000 \
            --max-time 140 --output "$p/node.tar.xz" https://nodejs.org/dist/v24.19.0/node-v24.19.0-linux-x64.tar.xz >>"$out" 2>&1
          [[ $(sha256sum "$p/node.tar.xz" | cut -d' ' -f1) = 14b342e71204f811bde6153be8e04b62aef63c236fef92b55f9c83154b409647 ]]
          tar -xJf "$p/node.tar.xz" -C "$p" >>"$out" 2>&1
          stage=NPM_SUPPLY
          npm_rc=0
          env -i PATH=/usr/bin:/bin HOME="$p" /usr/bin/python3 -IB "$p/online_b368_inputs.py" acquire "$p" >>"$out" 2>&1 || npm_rc=$?
          if [[ -f "$p/npm-status" ]]; then
            grep -Ex 'B368_NPM_(OK|HTTP_(302|403|404|429|500|502|503|504|OTHER)|TRANSPORT|TIMEOUT|RESPONSE_OR_SRI|LOCAL_OR_FORMAT)=[0-9]{1,3}' "$p/npm-status"
          fi
          (( npm_rc == 0 )) || exit "$npm_rc"
          stage=ISOLATION
          mkdir "$p/home" "$p/tmp"
          : > "$p/home/user.npmrc"; : > "$p/home/global.npmrc"
          uid=$(id -u); gid=$(id -g)
          test "$uid" -ne 0
          sudo -n /usr/bin/unshare -n /bin/sh -ec '
            /usr/sbin/ip link set lo up
            test "$(/usr/sbin/ip -o link | wc -l)" = 1
            test -z "$(/usr/sbin/ip route show)"
            test -z "$(/usr/sbin/ip -6 route show default)"
            exec /usr/bin/setpriv --reuid="$1" --regid="$2" --clear-groups --no-new-privs /usr/bin/env -i PATH=/usr/bin:/bin /usr/bin/true
          ' check "$uid" "$gid" >>"$out" 2>&1
          stage=OFFLINE_REBUILD_HANDOFF
          sudo -n /usr/bin/unshare -n /bin/sh -ec '
            /usr/sbin/ip link set lo up
            test "$(/usr/sbin/ip -o link | wc -l)" = 1
            test -z "$(/usr/sbin/ip route show)"
            test -z "$(/usr/sbin/ip -6 route show default)"
            p=$3
            exec /usr/bin/setpriv --reuid="$1" --regid="$2" --clear-groups --no-new-privs /usr/bin/env -i \
              PATH="$p/node-v24.19.0-linux-x64/bin:/usr/bin:/bin" HOME="$p/home" TMPDIR="$p/tmp" LC_ALL=C.UTF-8 \
              GIT_CONFIG_NOSYSTEM=1 GIT_CONFIG_GLOBAL=/dev/null GIT_TERMINAL_PROMPT=0 GIT_NO_LAZY_FETCH=1 GIT_OPTIONAL_LOCKS=0 GIT_ALLOW_PROTOCOL=file \
              PYTHONDONTWRITEBYTECODE=1 npm_config_userconfig="$p/home/user.npmrc" npm_config_globalconfig="$p/home/global.npmrc" \
              npm_config_offline=true npm_config_update_notifier=false npm_config_ignore_scripts=true \
              /usr/bin/python3 -IB "$p/online_b368_inputs.py" offline "$p"
          ' offline "$uid" "$gid" "$p" >"$p/new-handoff.summary" 2>>"$out"
          stage=EXACT_HANDOFF_READBACK
          grep -Fx "B368_FACADE_HANDOFF_TAR=3a34fcc0d6532cb338cd85a1c4b683aec865d15be17ef57aaee2e28938fa47d1" "$p/new-handoff.summary"
          grep -Fx "B368_FACADE_HANDOFF_MANIFEST=816de0a91c6edc972e7793222f77b6c87b92b8411b7b141d2021ed408ac2e0b1" "$p/new-handoff.summary"
          grep -Fx "B368_FACADE_HANDOFF_DESCRIPTOR=d81d53a901eb819691ac729411b2f7f7bd8763a352b4d6caee0225defeacf6ea" "$p/new-handoff.summary"
          grep -Fx B368_FACADE_BASELINE_PROJECTION=PASS "$p/new-handoff.summary"
          printf 'B368_CURRENT_HANDOFF=14\n'
          mkdir -p "$p/producer-home" "$p/consumer-home" "$p/sdk/platforms" "$p/sdk/build-tools" "$p/sdk-stage" "$p/ro"
          stage=TOOLCHAIN
          dl() {
            local u=$1 f=$2 bytes=$3 pin=$4
            env -i PATH=/usr/bin:/bin HOME="$p" curl --disable -fsSL --proto '=https' --proto-redir '=https' --max-redirs 4 --max-time 220 --max-filesize "$bytes" --output "$f" "$u" >>"$out" 2>&1
            [[ $(stat -c %s "$f") = "$bytes" && $(sha256sum "$f" | cut -d' ' -f1) = "$pin" ]]
          }
          dl https://services.gradle.org/distributions/gradle-9.3.1-bin.zip "$p/g.zip" 137037885 b266d5ff6b90eada6dc3b20cb090e3731302e553a27c5d3e4df1f0d76beaff06
          dl 'https://github.com/adoptium/temurin17-binaries/releases/download/jdk-17.0.21%2B9/OpenJDK17U-jdk_x64_linux_hotspot_17.0.21_9.tar.gz' "$p/j.tgz" 193594705 8b9b611d917e3dfd8419d3566b5949226f69b052fed7e109c1368add1dfe8711
          unzip -q "$p/g.zip" -d "$p" >>"$out" 2>&1
          tar -xzf "$p/j.tgz" -C "$p" >>"$out" 2>&1
          j="$p/jdk-17.0.21+9"; g="$p/gradle-9.3.1/bin/gradle"
          [[ -x "$j/bin/java" && -x "$g" ]]
          stage=SDK
          dl https://dl.google.com/android/repository/platform-37.0_r02.zip "$p/platform.zip" 67281901 840b23e827f96e64aea4c89a1194aac3dc5f6bad37edb231c5c795d890330e8d
          dl https://dl.google.com/android/repository/build-tools_r36_linux.zip "$p/build-tools.zip" 63737259 5d9ac77fb6ff43d9da518a337b4fcf8f9097113df531d99ccefe80ef7ce8250b
          unzip -q "$p/platform.zip" -d "$p/sdk/platforms" >>"$out" 2>&1
          unzip -q "$p/build-tools.zip" -d "$p/sdk-stage" >>"$out" 2>&1
          [[ -d "$p/sdk-stage/android-16" && ! -L "$p/sdk-stage/android-16" && ! -e "$p/sdk/build-tools/36.0.0" ]]
          [[ $(realpath -e "$p/sdk-stage/android-16") = "$p/sdk-stage/android-16" && $(realpath -e "$p/sdk/build-tools") = "$p/sdk/build-tools" ]]
          mv -T "$p/sdk-stage/android-16" "$p/sdk/build-tools/36.0.0"
          [[ -f "$p/sdk/platforms/android-37.0/android.jar" && -x "$p/sdk/build-tools/36.0.0/aapt2" ]]
          stage=NDK
          dl https://dl.google.com/android/repository/android-ndk-r26d-linux.zip "$p/ndk.zip" 668556491 eefeafe7ccf177de7cc57158da585e7af119bb7504a63604ad719e4b2a328b54
          mkdir "$p/ndk-stage" "$p/sdk/ndk"
          unzip -q "$p/ndk.zip" -d "$p/ndk-stage" >>"$out" 2>&1
          [[ $(realpath -e "$p/ndk-stage/android-ndk-r26d") = "$p/ndk-stage/android-ndk-r26d" && $(realpath -e "$p/sdk/ndk") = "$p/sdk/ndk" && ! -e "$p/sdk/ndk/26.3.11579264" ]]
          [[ $(sha256sum "$p/ndk-stage/android-ndk-r26d/source.properties" | cut -d' ' -f1) = c16df8635bca2590bb8c2bcc67aaef99f853c71f2d86ff4603189780c45a6e4e ]]
          mv -T "$p/ndk-stage/android-ndk-r26d" "$p/sdk/ndk/26.3.11579264"
          stage=SDK_REGISTRATION
          sdk_image="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          env -i PATH=/usr/bin:/bin /usr/bin/python3 -IB - "$p/sdk" "$sdk_image" >>"$out" 2>&1 <<'PY'
          from pathlib import Path
          from xml.etree import ElementTree as E
          import hashlib,sys
          raw,ima=map(Path,sys.argv[1:]); assert ima.resolve()==ima and raw.resolve()==raw
          def digest(p):
              assert p.is_file() and p.resolve()==p
              with p.open('rb') as f:return hashlib.file_digest(f,'sha256').hexdigest()
          matched=[]
          for d,name,revision,checks in [('platforms/android-37.0','platforms;android-37.0',[2],('android.jar','core-for-system-modules.jar','source.properties')),('build-tools/36.0.0','build-tools;36.0.0',[36,0,0],('aapt2','aidl','source.properties'))]:
              a,b=raw/d,ima/d
              for f in checks:assert digest(a/f)==digest(b/f),f
              f=b/'package.xml'; assert f.resolve()==f and 0<f.stat().st_size<65536
              body=f.read_bytes(); node=E.fromstring(body).find('localPackage');assert node.attrib['path']==name
              assert [int(x.text) for x in node.find('revision')]==revision
              if d.startswith('platforms/'):
                  attrs={x.tag:x.text for x in node.find('type-details')}
                  assert attrs['api-level']=='37.0' and attrs['extension-level']=='22' and attrs['base-extension']=='true'
              assert not (a/'package.xml').exists()
              matched.append((a/'package.xml',body))
          for n,b in matched:
              with n.open('xb') as f:f.write(b)
          PY
          echo B368_SDK_REGISTERED_METADATA=HOSTED_PACKAGE_XML_WITH_MATCHING_TOOL_BYTES
          stage=COMPILER_SUPPLY
          cd "$p/receiver"
          opts=(--no-daemon --no-parallel --no-configuration-cache --no-build-cache --max-workers=1 --dependency-verification=strict --console=plain
            '-Dorg.gradle.jvmargs=-Xmx2048m -XX:ActiveProcessorCount=2 -Dfile.encoding=UTF-8' -Pdsha.identity=rebirth -Pdsha.rebirthCandidate=true -Pdsha.unsignedPackage=true -Pdsha.rust.mode=off -Pandroid.builder.sdkDownload=false -Porg.gradle.java.installations.auto-download=false)
          reason() {
            local m=$1 l=$2
            if grep -Fq 'Dependency verification failed' "$l"; then printf 'B368_COMPILE_REASON=%s:DEPENDENCY_VERIFICATION\n' "$m"; fi
            if grep -Fq 'available for offline mode' "$l"; then printf 'B368_COMPILE_REASON=%s:OFFLINE_CACHE_MISS\n' "$m"; fi
            if grep -Eqi 'No matching variant|no compatible variant' "$l"; then printf 'B368_COMPILE_REASON=%s:VARIANT\n' "$m"; fi
            if grep -Fq 'B368_ACTUAL_ORIGIN_REFUSED:' "$l"; then printf 'B368_COMPILE_REASON=%s:GUARD\n' "$m"; fi
            if [[ $m = offline ]]; then
              for code in AGP_REPORT_TASKS AGP_REPORT_PATH AGP_REPORT_RESULT_BINDING AGP_REPORT_CONTRACT_EXISTS AGP_MANIFEST_TASK AGP_MANIFEST_CONTRACT_EXISTS; do
                if grep -Fq "B368_LINT_EXEC_REFUSED:$code" "$l"; then printf 'B368_LINT_DECLARATION_REFUSED=%s\n' "$code"; fi
              done
            fi
            if grep -Eq 'Could not resolve|Could not find|Could not get resource' "$l"; then printf 'B368_COMPILE_REASON=%s:RESOLVER\n' "$m"; fi
            if grep -Eq 'NDK not configured|No version of NDK matched|Failed to find target' "$l"; then printf 'B368_COMPILE_REASON=%s:SDK_NDK\n' "$m"; fi
            if grep -Fq 'B368_PRIVATE_EXACT_GRAPH=31' "$l"; then echo B368_COMPILE_GRAPH=31; fi
            python3 -IB - "$m" "$l" <<'PY'
          import re,sys
          from pathlib import Path
          phase,path=sys.argv[1:]; t=Path(path).read_text(errors='replace')
          result={'GOOGLE':r"Could not (?:GET|HEAD|get resource)[^\n]+https://dl\.google\.com/",
                  'CENTRAL':r"Could not (?:GET|HEAD|get resource)[^\n]+https://repo\.maven\.apache\.org/",
                  'HTTP_403':r'(?:status code|HTTP)[ :]+403\b','HTTP_429':r'(?:status code|HTTP)[ :]+429\b',
                  'HTTP_5XX':r'(?:status code|HTTP)[ :]+5\d\d\b','TLS':r'(?i)PKIX|handshake|peer not authenticated',
                  'TIMEOUT':r'(?i)timed out|timeout'}
          for k,v in result.items():
              if re.search(v,t):print(f'B368_COMPILE_REASON={phase}:{k}')
          PY
            if [[ $m = lint || $m = offline ]]; then
              python3 -IB "$p/online_b368_lint_diagnostics.py" "$m" "$l" "$p/receiver/gradle/verification-metadata.xml" "$p/online_b368_lint_guard.init.gradle" 2>>"$out" || echo B368_LINT_DIAGNOSTICS=REFUSED
            else
              python3 -IB "$p/online_b368_compile_diagnostics.py" "$m" "$l" "$p/receiver/gradle/verification-metadata.xml" "$p/online_b368_compile_guard.init.gradle" 2>>"$out" || echo B368_COMPILE_DIAGNOSTICS=REFUSED
            fi
          }
          retries=0
          for m in runtime compile aapt2 kotlin lint; do
            supply_init="$p/online_b368_compile_supply.init.gradle"
            if [[ $m = lint ]]; then supply_init="$p/online_b368_lint_supply.init.gradle"; fi
            for attempt in 1 2; do
              rc=0
              supply_log="$p/$m.supply.$attempt.log"
              env -i PATH="$j/bin:/usr/bin:/bin" JAVA_HOME="$j" ANDROID_HOME="$p/sdk" HOME="$p/home" TMPDIR="$p/tmp" LC_ALL=C.UTF-8 \
                DSHA_PYTHON=/usr/bin/python3 GRADLE_USER_HOME="$p/producer-home" B368_ORIGIN_MODE="$m" B368_ORIGIN_REPORT="$p/$m.supply.json" \
                "$g" "${opts[@]}" --project-cache-dir "$p/p-cache" -I "$supply_init" :app:probeB368ActualOrigin >"$supply_log" 2>&1 || rc=$?
              if (( rc == 0 )); then break; fi
              if (( attempt == 1 && retries == 0 )) && [[ ! -e "$p/$m.supply.json" ]] && \
                python3 -IB "$p/online_b368_retry_429.py" "$supply_log" >>"$out" 2>&1; then
                printf 'B368_CENTRAL_BACKOFF=%s:65\n' "$m"
                retries=1
                sleep 65
              else
                break
              fi
            done
            printf 'B368_COMPILE_SUPPLY=%s:%s\n' "$m" "$rc"
            if (( rc != 0 )); then reason "$m" "$supply_log"; exit "$rc"; fi
            [[ -s "$p/$m.supply.json" ]]
            if [[ $m = kotlin ]]; then
              python3 -IB - "$p/kotlin.supply.json" <<'PY'
          import json, sys
          from pathlib import Path
          q=json.loads(Path(sys.argv[1]).read_bytes()); assert q['mode']=='kotlin' and q['offline'] is False
          k=q['configurations']; assert set(k)=={'kotlinBuildToolsApiClasspath','kotlinCompilerClasspath'}
          for name,rows in k.items():
              assert 0<len(rows)<128
              print(f'B368_KOTLIN_TOOL_COUNT={name}:{len(rows)}')
          PY
            fi
          done
          python3 -IB - "$p/lint.supply.json" <<'PY'
          import json,sys
          from pathlib import Path
          q=json.loads(Path(sys.argv[1]).read_bytes()); assert q['mode']=='lint' and q['offline'] is False
          assert len(q['rows'])==67 and type(q['localRules']) is int and 0<=q['localRules']<=100
          print('B368_LINT_SUPPLY_TOOL_ROWS='+str(len(q['rows'])))
          print('B368_LINT_SUPPLY_RULE_ROWS='+str(q['localRules']))
          assert 1<=len(q['desugarRows'])<=8
          print('B368_LINT_SUPPLY_DESUGAR_ROWS='+str(len(q['desugarRows'])))
          PY
          [[ ! -d "$p/receiver/app/build" ]]
          stage=OFFLINE_LINT
          rc=0
          sudo -n /usr/bin/unshare -nm --propagation private /bin/bash -ec '
            uid=$1; gid=$2; p=$3; j=$4; g=$5; shift 5
            /usr/sbin/ip link set lo up
            test "$(/usr/sbin/ip -o link | wc -l)" = 1
            test -z "$(/usr/sbin/ip route show)"
            test -z "$(/usr/sbin/ip -6 route show default)"
            mount --bind "$p/producer-home/caches" "$p/ro"
            mount -o remount,bind,ro,nosuid,nodev,noexec "$p/ro"
            test -d "$p/ro/modules-2"
            mount --bind "$p/sdk" "$p/sdk"
            mount -o remount,bind,ro,nosuid,nodev "$p/sdk"
            for d in app/src tools build-logic gradle ci .git .github rust; do
              x="$p/receiver/$d"
              test "$(realpath -e "$x")" = "$x"
              mount --bind "$x" "$x"
              mount -o remount,bind,ro,nosuid,nodev "$x"
            done
            test -z "$(ls -A "$p/consumer-home")"
            exec /usr/bin/setpriv --reuid="$uid" --regid="$gid" --clear-groups --no-new-privs /usr/bin/env -i \
              PATH="$j/bin:/usr/bin:/bin" JAVA_HOME="$j" ANDROID_HOME="$p/sdk" HOME="$p/home" TMPDIR="$p/tmp" LC_ALL=C.UTF-8 \
              DSHA_PYTHON=/usr/bin/python3 GIT_OPTIONAL_LOCKS=0 GIT_CONFIG_NOSYSTEM=1 GIT_CONFIG_GLOBAL=/dev/null GIT_NO_LAZY_FETCH=1 \
              PYTHONDONTWRITEBYTECODE=1 GRADLE_USER_HOME="$p/consumer-home" GRADLE_RO_DEP_CACHE="$p/ro" B368_LINT_DECLARED_OUTPUTS="$p/lint.outputs.json" \
              /usr/bin/python3 -IB "$p/online_b368_compile_monitor.py" "$p" "$g" "$@" --offline --project-cache-dir "$p/compile-cache" \
              -I "$p/online_b368_lint_guard.init.gradle" :app:lintStandardRelease
          ' compile "$uid" "$gid" "$p" "$j" "$g" "${opts[@]}" >"$p/monitor.log" 2>&1 || rc=$?
          grep -Ex 'B368_COMPILE_(ENTRY_MIB|MIN_MIB)=[0-9]{1,8}|B368_COMPILE_RESOURCE_OR_TIME_STOP=true' "$p/monitor.log" || :
          if [[ -f "$p/compile.log" ]]; then reason offline "$p/compile.log"; fi
          printf 'B368_LINT_GRADLE_EXIT=%s\n' "$rc"
          if ! grep -Fxq 'B368_PRIVATE_LINT_EXACT_GRAPH=37' "$p/compile.log"; then
            echo B368_LINT_EXACT_GRAPH=REFUSED
            if (( rc != 0 )); then exit "$rc"; else exit 1; fi
          fi
          echo B368_LINT_EXACT_GRAPH=37
          if [[ ! -s "$p/lint.outputs.json" ]]; then
            echo B368_LINT_REPORT_REFUSED=DECLARATION
            exit 1
          fi
          for task in lintAnalyzeStandardRelease lintReportStandardRelease; do
            if grep -Fxq "> Task :app:$task" "$p/compile.log" || grep -Fxq "> Task :app:$task FAILED" "$p/compile.log"; then
              printf 'B368_LINT_EXECUTED_TASK=%s\n' "$task"
            else
              printf 'B368_LINT_MISSING_TASK=%s\n' "$task"
              if (( rc != 0 )); then exit "$rc"; else exit 1; fi
            fi
          done
          stage=LINT_REPORT
          if [[ -n $(find app/build -type f \( -name '*.apk' -o -name '*.dex' \) -print -quit) ]]; then echo B368_LINT_REPORT_REFUSED=UNEXPECTED_DEX_OR_APK; exit 1; fi
          report_rc=0
          python3 -IB "$p/online_b368_lint_report.py" "$p/receiver/app/build" "$p/lint.outputs.json" >"$p/lint.summary" 2>>"$out" || report_rc=$?
          grep -Ex 'B368_LINT_(REPORT_COUNT=(errors|warnings|other):[0-9]{1,6}|REPORT_SHA256=[a-f0-9]{64}|TOOL_STATUS=[0-7]|TEXT_COUNTERS=[0-9]{1,6}:[0-9]{1,6}|TEXT=UNAVAILABLE|REPORT_REFUSED=(DECLARATION|TOOL_STATUS|XML_DISABLED|XML_MISSING_OR_UNSAFE|XML_SCHEMA)|XML_REASON=(SIZE|UNSAFE|ROOT|ISSUE|SEVERITY|COUNT|ENCODING|PARSE|OTHER)|FIRST_LOCATION_STATE=(NONE|PUBLIC|WITHHELD)|FIRST_PUBLIC_LOCATION=app/src/(main|standard|rebirthTrial)/[A-Za-z0-9_./-]{1,220}\.(kt|java|xml):[1-9][0-9]{0,5})' "$p/lint.summary" || echo B368_LINT_REPORT_REFUSED=NO_VERIFIED_REPORT
          stage=MERGED_PERMISSION
          manifest_rc=0
          if grep -Fxq '> Task :app:processStandardReleaseMainManifest' "$p/compile.log"; then
            python3 -IB "$p/verify_b368_merged_permission.py" "$p/receiver/app/build" "$p/lint.outputs.json.manifest" 2>>"$out" || manifest_rc=$?
          else
            echo B368_LINT_MERGED_PERMISSION=REFUSED
            manifest_rc=1
          fi
          (( rc == 0 )) || exit "$rc"
          (( report_rc == 0 )) || exit "$report_rc"
          (( manifest_rc == 0 )) || exit "$manifest_rc"
          printf 'B368_LINT=PASS\nB368_FORMAL_ADMISSION=false\n'
