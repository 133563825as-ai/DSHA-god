name: Root independent authority audit
on:
  push:
    branches: ['codex/root-functional-audit-20261122']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  synthetic-authority-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad
        with:
          distribution: temurin
          java-version: '17'
      - name: Compile production gate and synthetic audit
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/root-audit/classes"
          javac -encoding UTF-8 -d "$RUNNER_TEMP/root-audit/classes" \
            app/src/main/java/com/deepseekharness/app/util/RootRequestGate.java \
            app/src/main/java/com/deepseekharness/app/util/RootRequestWire.java \
            tools/audits/RootIndependentAuthorityAudit.java
      - name: Verify two controls and reproduce known gap
        shell: bash
        run: |
          java -ea -cp "$RUNNER_TEMP/root-audit/classes" \
            com.deepseekharness.app.util.RootIndependentAuthorityAudit \
            | tee "$RUNNER_TEMP/root-audit/evidence.txt"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: root-independent-authority-audit
          path: ${{ runner.temp }}/root-audit/evidence.txt
          if-no-files-found: error
