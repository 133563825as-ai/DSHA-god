            --output "$p/fixed.zip" "$url" >>"$out" 2>&1
          stage=PIN
          [[ $(stat -c %s "$p/fixed.zip") = 716787167 ]]
          [[ $(sha256sum "$p/fixed.zip" | cut -d' ' -f1) = "$hash" ]]
          stage=SET
          env -i PATH=/usr/bin:/bin HOME="$p" python3 -IB - "$p/fixed.zip" "$p/src" "$hash" "$url" >>"$out" 2>&1 <<'PY'
          import json, pathlib, sys, zipfile
          archive, source, pin, url = sys.argv[1:]
          lock = json.loads((pathlib.Path(source) / 'ci/sunset-inputs.lock.json').read_bytes())
          assert (lock['url'], lock['sha256'], lock['bytes'], lock['format']) == (url, pin, 716787167, 'bundle')
          with zipfile.ZipFile(archive) as z:
              names = z.namelist()
              assert len(names) == len(set(names)) == 12
              assert not any(name.lower().endswith(('.apk', '.aab', '.apks')) for name in names)
          PY
          stage=ORIGINAL_RESTORE
          cd "$p/src"
          env -i PATH=/usr/bin:/bin HOME="$p" LC_ALL=C.UTF-8 /usr/bin/python3 -sB tools/ci-assets.py \
            --archive "$p/fixed.zip" --sha256 "$hash" >>"$out" 2>&1
          grep -Fxq 'PASS locked CI asset inputs; source builders must verify their own recipe metadata' "$out"
          stage=WORKER
          env -i PATH=/usr/bin:/bin HOME="$p" GIT_CONFIG_NOSYSTEM=1 GIT_CONFIG_GLOBAL=/dev/null GIT_TERMINAL_PROMPT=0 bash -euc '
            git init -q --template= "$1/worker"
            git -C "$1/worker" fetch --quiet --no-tags --depth 1 https://github.com/133563825as-ai/DSHA-god.git "$2"
            test "$(git -C "$1/worker" rev-parse FETCH_HEAD)" = "$2"
            git -C "$1/worker" show FETCH_HEAD:online_b368_inputs.py > "$1/online_b368_inputs.py"
            git -C "$1/worker" show FETCH_HEAD:seed.cjs > "$1/seed.cjs"
            for f in online_b368_compile_supply.init.gradle online_b368_compile_guard.init.gradle online_b368_compile_monitor.py online_b368_retry_429.py online_b368_compile_diagnostics.py online_b368_joint_class.sh read_compiled_release.py baseline-runtime-descriptor.json online_b368_force_junit.py; do
              git -C "$1/worker" show "FETCH_HEAD:$f" > "$1/$f"
            done
          ' worker "$p" "$GITHUB_SHA" >>"$out" 2>&1
          [[ $(sha256sum "$p/seed.cjs" | cut -d' ' -f1) = c1de8dcc8c727c71539793c9ce94bf735aa7c68bd6560af42f6f8c5fffed0c95 ]]
          stage=NODE
          env -i PATH=/usr/bin:/bin HOME="$p" curl --disable --silent --show-error --fail --proto '=https' --max-filesize 50000000 \
            --max-time 140 --output "$p/node.tar.xz" https://nodejs.org/dist/v24.19.0/node-v24.19.0-linux-x64.tar.xz >>"$out" 2>&1
          [[ $(sha256sum "$p/node.tar.xz" | cut -d' ' -f1) = 14b342e71204f811bde6153be8e04b62aef63c236fef92b55f9c83154b409647 ]]
          tar -xJf "$p/node.tar.xz" -C "$p" >>"$out" 2>&1
          stage=NPM_SUPPLY
          npm_rc=0
          env -i PATH=/usr/bin:/bin HOME="$p" /usr/bin/python3 -IB "$p/online_b368_inputs.py" acquire "$p" >>"$out" 2>&1 || npm_rc=$?
          if [[ -f "$p/npm-status" ]]; then
            grep -Ex 'B368_NPM_(OK|HTTP_(302|403|404|429|500|502|503|504|OTHER)|TRANSPORT|TIMEOUT|RESPONSE_OR_SRI|LOCAL_OR_FORMAT)=[0-9]{1,3}' "$p/npm-status"
          fi
          (( npm_rc == 0 )) || exit "$npm_rc"
          stage=ISOLATION
          mkdir "$p/home" "$p/tmp"
          : > "$p/home/user.npmrc"; : > "$p/home/global.npmrc"
          uid=$(id -u); gid=$(id -g)
          test "$uid" -ne 0
          sudo -n /usr/bin/unshare -n /bin/sh -ec '
            /usr/sbin/ip link set lo up
            test "$(/usr/sbin/ip -o link | wc -l)" = 1
            test -z "$(/usr/sbin/ip route show)"
            test -z "$(/usr/sbin/ip -6 route show default)"
            exec /usr/bin/setpriv --reuid="$1" --regid="$2" --clear-groups --no-new-privs /usr/bin/env -i PATH=/usr/bin:/bin /usr/bin/true
          ' check "$uid" "$gid" >>"$out" 2>&1
          stage=OFFLINE_REBUILD_HANDOFF
          sudo -n /usr/bin/unshare -n /bin/sh -ec '
            /usr/sbin/ip link set lo up
