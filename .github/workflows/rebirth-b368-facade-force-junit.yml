              GIT_CONFIG_NOSYSTEM=1 GIT_CONFIG_GLOBAL=/dev/null GIT_TERMINAL_PROMPT=0 GIT_NO_LAZY_FETCH=1 GIT_OPTIONAL_LOCKS=0 GIT_ALLOW_PROTOCOL=file \
              PYTHONDONTWRITEBYTECODE=1 npm_config_userconfig="$p/home/user.npmrc" npm_config_globalconfig="$p/home/global.npmrc" \
              npm_config_offline=true npm_config_update_notifier=false npm_config_ignore_scripts=true \
              /usr/bin/python3 -IB "$p/online_b368_inputs.py" offline "$p"
          ' offline "$uid" "$gid" "$p" >"$p/new-handoff.summary" 2>>"$out"
          grep -Ex 'B368_FACADE_(HANDOFF_TAR|HANDOFF_MANIFEST|HANDOFF_DESCRIPTOR)=[a-f0-9]{64}|B368_FACADE_BASELINE_PROJECTION=PASS' "$p/new-handoff.summary"
          printf 'B368_CURRENT_HANDOFF=14\n'
          mkdir -p "$p/producer-home" "$p/consumer-home" "$p/sdk/platforms" "$p/sdk/build-tools" "$p/sdk-stage" "$p/ro"
          grep -Fxq "B368_FACADE_HANDOFF_TAR=3a34fcc0d6532cb338cd85a1c4b683aec865d15be17ef57aaee2e28938fa47d1" "$p/new-handoff.summary"
          grep -Fxq "B368_FACADE_HANDOFF_MANIFEST=816de0a91c6edc972e7793222f77b6c87b92b8411b7b141d2021ed408ac2e0b1" "$p/new-handoff.summary"
          grep -Fxq "B368_FACADE_HANDOFF_DESCRIPTOR=d81d53a901eb819691ac729411b2f7f7bd8763a352b4d6caee0225defeacf6ea" "$p/new-handoff.summary"
          stage=TOOLCHAIN
          dl() {
            local u=$1 f=$2 bytes=$3 pin=$4
            env -i PATH=/usr/bin:/bin HOME="$p" curl --disable -fsSL --proto '=https' --proto-redir '=https' --max-redirs 4 --max-time 220 --max-filesize "$bytes" --output "$f" "$u" >>"$out" 2>&1
            [[ $(stat -c %s "$f") = "$bytes" && $(sha256sum "$f" | cut -d' ' -f1) = "$pin" ]]
          }
          dl https://services.gradle.org/distributions/gradle-9.3.1-bin.zip "$p/g.zip" 137037885 b266d5ff6b90eada6dc3b20cb090e3731302e553a27c5d3e4df1f0d76beaff06
          dl 'https://github.com/adoptium/temurin17-binaries/releases/download/jdk-17.0.21%2B9/OpenJDK17U-jdk_x64_linux_hotspot_17.0.21_9.tar.gz' "$p/j.tgz" 193594705 8b9b611d917e3dfd8419d3566b5949226f69b052fed7e109c1368add1dfe8711
          unzip -q "$p/g.zip" -d "$p" >>"$out" 2>&1
          tar -xzf "$p/j.tgz" -C "$p" >>"$out" 2>&1
          j="$p/jdk-17.0.21+9"; g="$p/gradle-9.3.1/bin/gradle"
          [[ -x "$j/bin/java" && -x "$g" ]]
          stage=SDK
          dl https://dl.google.com/android/repository/platform-37.0_r02.zip "$p/platform.zip" 67281901 840b23e827f96e64aea4c89a1194aac3dc5f6bad37edb231c5c795d890330e8d
          dl https://dl.google.com/android/repository/build-tools_r36_linux.zip "$p/build-tools.zip" 63737259 5d9ac77fb6ff43d9da518a337b4fcf8f9097113df531d99ccefe80ef7ce8250b
          unzip -q "$p/platform.zip" -d "$p/sdk/platforms" >>"$out" 2>&1
          unzip -q "$p/build-tools.zip" -d "$p/sdk-stage" >>"$out" 2>&1
          [[ -d "$p/sdk-stage/android-16" && ! -L "$p/sdk-stage/android-16" && ! -e "$p/sdk/build-tools/36.0.0" ]]
          [[ $(realpath -e "$p/sdk-stage/android-16") = "$p/sdk-stage/android-16" && $(realpath -e "$p/sdk/build-tools") = "$p/sdk/build-tools" ]]
          mv -T "$p/sdk-stage/android-16" "$p/sdk/build-tools/36.0.0"
          [[ -f "$p/sdk/platforms/android-37.0/android.jar" && -x "$p/sdk/build-tools/36.0.0/aapt2" ]]
          stage=NDK
          dl https://dl.google.com/android/repository/android-ndk-r26d-linux.zip "$p/ndk.zip" 668556491 eefeafe7ccf177de7cc57158da585e7af119bb7504a63604ad719e4b2a328b54
          mkdir "$p/ndk-stage" "$p/sdk/ndk"
          unzip -q "$p/ndk.zip" -d "$p/ndk-stage" >>"$out" 2>&1
          [[ $(realpath -e "$p/ndk-stage/android-ndk-r26d") = "$p/ndk-stage/android-ndk-r26d" && $(realpath -e "$p/sdk/ndk") = "$p/sdk/ndk" && ! -e "$p/sdk/ndk/26.3.11579264" ]]
          [[ $(sha256sum "$p/ndk-stage/android-ndk-r26d/source.properties" | cut -d' ' -f1) = c16df8635bca2590bb8c2bcc67aaef99f853c71f2d86ff4603189780c45a6e4e ]]
          mv -T "$p/ndk-stage/android-ndk-r26d" "$p/sdk/ndk/26.3.11579264"
          stage=SDK_REGISTRATION
          sdk_image="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          env -i PATH=/usr/bin:/bin /usr/bin/python3 -IB - "$p/sdk" "$sdk_image" >>"$out" 2>&1 <<'PY'
          from pathlib import Path
          from xml.etree import ElementTree as E
          import hashlib,sys
          raw,ima=map(Path,sys.argv[1:]); assert ima.resolve()==ima and raw.resolve()==raw
          def digest(p):
              assert p.is_file() and p.resolve()==p
              with p.open('rb') as f:return hashlib.file_digest(f,'sha256').hexdigest()
          matched=[]
          for d,name,revision,checks in [('platforms/android-37.0','platforms;android-37.0',[2],('android.jar','core-for-system-modules.jar','source.properties')),('build-tools/36.0.0','build-tools;36.0.0',[36,0,0],('aapt2','aidl','source.properties'))]:
              a,b=raw/d,ima/d
              for f in checks:assert digest(a/f)==digest(b/f),f
              f=b/'package.xml'; assert f.resolve()==f and 0<f.stat().st_size<65536
              body=f.read_bytes(); node=E.fromstring(body).find('localPackage');assert node.attrib['path']==name
              assert [int(x.text) for x in node.find('revision')]==revision
              if d.startswith('platforms/'):
                  attrs={x.tag:x.text for x in node.find('type-details')}
                  assert attrs['api-level']=='37.0' and attrs['extension-level']=='22' and attrs['base-extension']=='true'
              assert not (a/'package.xml').exists()
              matched.append((a/'package.xml',body))
          for n,b in matched:
              with n.open('xb') as f:f.write(b)
          PY
          echo B368_SDK_REGISTERED_METADATA=HOSTED_PACKAGE_XML_WITH_MATCHING_TOOL_BYTES
          stage=COMPILER_SUPPLY
          cd "$p/receiver"
          opts=(--no-daemon --no-parallel --no-configuration-cache --no-build-cache --max-workers=1 --dependency-verification=strict --console=plain
            '-Dorg.gradle.jvmargs=-Xmx2048m -XX:ActiveProcessorCount=2 -Dfile.encoding=UTF-8' -Pdsha.identity=rebirth -Pdsha.rebirthCandidate=true -Pdsha.unsignedPackage=true -Pdsha.rust.mode=off -Pandroid.builder.sdkDownload=false -Porg.gradle.java.installations.auto-download=false)
          reason() {
            local m=$1 l=$2
            if grep -Fq 'Dependency verification failed' "$l"; then printf 'B368_COMPILE_REASON=%s:DEPENDENCY_VERIFICATION\n' "$m"; fi
            if grep -Fq 'available for offline mode' "$l"; then printf 'B368_COMPILE_REASON=%s:OFFLINE_CACHE_MISS\n' "$m"; fi
            if grep -Eqi 'No matching variant|no compatible variant' "$l"; then printf 'B368_COMPILE_REASON=%s:VARIANT\n' "$m"; fi
            if grep -Fq 'B368_ACTUAL_ORIGIN_REFUSED:' "$l"; then printf 'B368_COMPILE_REASON=%s:GUARD\n' "$m"; fi
            if grep -Eq 'Could not resolve|Could not find|Could not get resource' "$l"; then printf 'B368_COMPILE_REASON=%s:RESOLVER\n' "$m"; fi
            if grep -Eq 'NDK not configured|No version of NDK matched|Failed to find target' "$l"; then printf 'B368_COMPILE_REASON=%s:SDK_NDK\n' "$m"; fi
            if grep -Fq 'B368_PRIVATE_EXACT_GRAPH=31' "$l"; then echo B368_COMPILE_GRAPH=31; fi
            python3 -IB - "$m" "$l" <<'PY'
          import re,sys
          from pathlib import Path
          phase,path=sys.argv[1:]; t=Path(path).read_text(errors='replace')
          result={'GOOGLE':r"Could not (?:GET|HEAD|get resource)[^\n]+https://dl\.google\.com/",
                  'CENTRAL':r"Could not (?:GET|HEAD|get resource)[^\n]+https://repo\.maven\.apache\.org/",
                  'HTTP_403':r'(?:status code|HTTP)[ :]+403\b','HTTP_429':r'(?:status code|HTTP)[ :]+429\b',
                  'HTTP_5XX':r'(?:status code|HTTP)[ :]+5\d\d\b','TLS':r'(?i)PKIX|handshake|peer not authenticated',
                  'TIMEOUT':r'(?i)timed out|timeout'}
          for k,v in result.items():
              if re.search(v,t):print(f'B368_COMPILE_REASON={phase}:{k}')
          PY
            python3 -IB "$p/online_b368_compile_diagnostics.py" "$m" "$l" "$p/receiver/gradle/verification-metadata.xml" "$p/online_b368_compile_guard.init.gradle" 2>>"$out" || echo B368_COMPILE_DIAGNOSTICS=REFUSED
          }
          retries=0
          for m in runtime compile aapt2 kotlin; do
            supply_init="$p/online_b368_compile_supply.init.gradle"
            for attempt in 1 2; do
              rc=0
              supply_log="$p/$m.supply.$attempt.log"
              env -i PATH="$j/bin:/usr/bin:/bin" JAVA_HOME="$j" ANDROID_HOME="$p/sdk" HOME="$p/home" TMPDIR="$p/tmp" LC_ALL=C.UTF-8 \
                DSHA_PYTHON=/usr/bin/python3 GRADLE_USER_HOME="$p/producer-home" B368_ORIGIN_MODE="$m" B368_ORIGIN_REPORT="$p/$m.supply.json" \
                "$g" "${opts[@]}" --project-cache-dir "$p/p-cache" -I "$supply_init" :app:probeB368ActualOrigin >"$supply_log" 2>&1 || rc=$?
              if (( rc == 0 )); then break; fi
              if (( attempt == 1 && retries == 0 )) && [[ ! -e "$p/$m.supply.json" ]] && \
                python3 -IB "$p/online_b368_retry_429.py" "$supply_log" >>"$out" 2>&1; then
                printf 'B368_CENTRAL_BACKOFF=%s:65\n' "$m"
                retries=1
                sleep 65
              else
                break
              fi
            done
            printf 'B368_COMPILE_SUPPLY=%s:%s\n' "$m" "$rc"
            if (( rc != 0 )); then reason "$m" "$supply_log"; exit "$rc"; fi
            [[ -s "$p/$m.supply.json" ]]
            if [[ $m = kotlin ]]; then
              python3 -IB - "$p/kotlin.supply.json" <<'PY'
          import json, sys
          from pathlib import Path
          q=json.loads(Path(sys.argv[1]).read_bytes()); assert q['mode']=='kotlin' and q['offline'] is False
          k=q['configurations']; assert set(k)=={'kotlinBuildToolsApiClasspath','kotlinCompilerClasspath'}
          for name,rows in k.items():
              assert 0<len(rows)<128
              print(f'B368_KOTLIN_TOOL_COUNT={name}:{len(rows)}')
          PY
            fi
          done
          [[ ! -d "$p/receiver/app/build" ]]
          stage=OFFLINE_CLASS
          /bin/bash "$p/online_b368_joint_class.sh" "$p" "$p" "$j" "$g" "$uid" "$gid" "$c" "$t" "${opts[@]}"
          stage=JUNIT_SUPPLY
          dl https://repo.maven.apache.org/maven2/junit/junit/4.13.2/junit-4.13.2.jar "$p/junit-4.13.2.jar" 384581 8e495b634469d64fb8acfa3495a065cbacc8a0fff55ce1e31007be4c16dc57d3
          dl https://repo.maven.apache.org/maven2/org/hamcrest/hamcrest-core/1.3/hamcrest-core-1.3.jar "$p/hamcrest-core-1.3.jar" 45024 66fdef91e9739348df7a096aa384a5685f4e875584cce89386a7a47251c4d8e9
          stage=OFFLINE_FORCE_JUNIT
          [[ $(awk '/^MemAvailable:/ {print int($2/1024)}' /proc/meminfo) -ge 7168 ]]
          sudo -n /usr/bin/unshare -n /bin/bash -ec '
            u=$1; g=$2; p=$3; j=$4; c=$5; t=$6
            /usr/sbin/ip link set lo up
            test "$(/usr/sbin/ip -o link | wc -l)" = 1
            test -z "$(/usr/sbin/ip route show)" && test -z "$(/usr/sbin/ip -6 route show default)"
            exec /usr/bin/setpriv --reuid="$u" --regid="$g" --clear-groups --no-new-privs /usr/bin/env -i \
              PATH="$j/bin:/usr/bin:/bin" HOME="$p/home" TMPDIR="$p/tmp" LC_ALL=C.UTF-8 GIT_CONFIG_NOSYSTEM=1 GIT_CONFIG_GLOBAL=/dev/null GIT_NO_LAZY_FETCH=1 \
              /usr/bin/python3 -IB "$p/online_b368_force_junit.py" "$p" "$j" "$c" "$t"
          ' force "$uid" "$gid" "$p" "$j" "$c" "$t" 2>>"$out"
          printf 'B368_FORCE_JUNIT=PASS\nB368_FORMAL_ADMISSION=false\n'
