name: Rebirth b368 original locked Maven material
on:
  push:
    branches: [validate/rebirth-b368-locked-maven]
permissions: {}
jobs:
  intake:
    if: github.repository == '133563825as-ai/DSHA-god' && github.ref == 'refs/heads/validate/rebirth-b368-locked-maven'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Verify physical originals without publishing inputs or resolving a Gradle graph
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          set +x
          p=$(mktemp -d "$RUNNER_TEMP/b368-maven-XXXXXXXX")
          rev=b2ed231b165c90339a297e136e476e98ade67f11
          tree=7fb60ba40c3e60094c7ff02281a2a4058f6da545
          if ! env -i PATH=/usr/bin:/bin HOME="$p" GIT_CONFIG_NOSYSTEM=1 GIT_CONFIG_GLOBAL=/dev/null GIT_TERMINAL_PROMPT=0 bash -euc '
            url=https://github.com/133563825as-ai/DSHA-god.git
            git init -q --template= "$1/src"
            git -C "$1/src" fetch -q --depth 1 --no-tags "$url" "$2"
            git -C "$1/src" -c core.hooksPath=/dev/null checkout -q --detach FETCH_HEAD
            test "$(git -C "$1/src" rev-parse HEAD)" = "$2"
            test "$(git -C "$1/src" rev-parse HEAD^{tree})" = "$3"
            test -z "$(git -C "$1/src" status --porcelain=v1)"
            git init -q --template= "$1/worker"
            git -C "$1/worker" fetch -q --depth 1 --no-tags "$url" "$4"
            test "$(git -C "$1/worker" rev-parse FETCH_HEAD)" = "$4"
            git -C "$1/worker" show FETCH_HEAD:online_b368_maven.py > "$1/intake.py"
          ' verify "$p" "$rev" "$tree" "$GITHUB_SHA" >"$p/setup.log" 2>&1; then
            printf 'B368_MAVEN_SETUP=REFUSED\n'
            exit 1
          fi
          rc=0
          env -i PATH=/usr/bin:/bin HOME="$p" /usr/bin/python3 -IB "$p/intake.py" "$p/src" "$p/material" >"$p/result" 2>"$p/diagnostic.log" || rc=$?
          grep -Ex 'B368_MAVEN_ITEM=(groovy|httpclient-jar|httpclient-pom|annotation-jar|annotation-module|android-json):(PASS|HTTP_SHAPE|HTTP_[1-5][0-9][0-9]|HTTP_OTHER|SIZE|SHA256|TRANSPORT|LOCAL_IO):[0-9]{1,8}|B368_MAVEN_PHYSICAL_MATCHES=[0-6]' "$p/result" || :
          printf 'B368_MAVEN_SOURCE=%s\nB368_GRADLE_RESOLVED=false\nB368_FORMAL_ADMISSION=false\n' "$rev"
          exit "$rc"
